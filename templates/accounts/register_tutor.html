{% extends "base.html" %}
{% block title %}Register as Tutor{% endblock %}
{% block content %}
<section class="container" style="max-width:480px">
  <article class="card">
    <h1>Become a tutor</h1>
    <p style="color:var(--muted);margin-bottom:1rem">Your profile will be reviewed before going live.</p>
    <form method="post">{% csrf_token %}
      {% for field in form %}
      <p class="form-group"><label>{{ field.label }}</label>{{ field }}{% if field.errors %}<small style="color:var(--danger)">{{ field.errors.0 }}</small>{% endif %}</p>
      {% endfor %}
      <button type="submit" class="btn btn-secondary" style="width:100%">Register</button>
    </form>
  </article>
</section>
{% endblock %}
