{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<section class="container" style="max-width:420px">
  <article class="card">
    <h1>Welcome back</h1>
    <form method="post">{% csrf_token %}
      <p class="form-group"><label>Username</label>{{ form.username }}</p>
      <p class="form-group"><label>Password</label>{{ form.password }}</p>
      <button type="submit" class="btn btn-primary" style="width:100%">Login</button>
    </form>
    <p style="margin-top:1rem;color:var(--muted)">No account? <a href="{% url 'accounts:register_student' %}">Student</a> or <a href="{% url 'accounts:register_tutor' %}">Tutor</a>.</p>
  </article>
</section>
{% endblock %}
