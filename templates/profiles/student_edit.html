{% extends "base.html" %}
{% block title %}Edit Profile{% endblock %}
{% block content %}
<section class="container" style="max-width:600px">
  <article class="card"><h1>Edit profile</h1>
  <form method="post" enctype="multipart/form-data">{% csrf_token %}
  {% for field in form %}<p class="form-group"><label>{{ field.label }}</label>{{ field }}</p>{% endfor %}
  <button class="btn btn-primary">Save</button></form></article>
</section>
{% endblock %}
