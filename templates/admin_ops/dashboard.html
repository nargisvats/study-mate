{% extends "base.html" %}{% block content %}<div class="container"><h1>Admin dashboard</h1>
<div class="dashboard-grid">{% for k,v in stats.items %}<div class="card stat-card"><div class="value">{{ v }}</div><div class="label">{{ k }}</div></div>{% endfor %}</div>
<h2>Pending tutors</h2>{% for t in pending_tutors %}<p>{{ t.display_name }} — <a href="/admin/profiles/tutorprofile/{{ t.pk }}/change/">Review</a></p>{% endfor %}
</div>{% endblock %}
